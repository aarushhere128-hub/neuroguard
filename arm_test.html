<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arm Assessment | NeuroGuard</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/arm.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#2563EB">
    <link rel="apple-touch-icon" href="assets/icon-192.png">

    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script type="module" src="js/auth-guard.js">
    <style>
    /* =========================================================
       Unified Arm Assessment Modern Glass HUD Styling
    ========================================================= */

    :root {
        --bg-main: #05070a;
        --card-bg: rgba(15, 23, 42, 0.75);
        --card-border: rgba(56, 189, 248, 0.18);
        --primary-glow: rgba(37, 99, 235, 0.35);
        --accent-blue: #38bdf8;
        --accent-green: #34d399;
        --accent-red: #ef4444;
    }

    body {
        background-color: var(--bg-main);
        color: #f8fafc;
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
    }

    .arm-page-container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 120px 6% 80px 6%;
    }

    .arm-hero {
        text-align: center;
        margin-bottom: 40px;
    }

    .arm-hero .badge {
        display: inline-block;
        background: rgba(37, 99, 235, 0.15);
        border: 1px solid rgba(56, 189, 248, 0.3);
        color: var(--accent-blue);
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.05em;
        margin-bottom: 16px;
        text-transform: uppercase;
    }

    .arm-hero h1 {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
        color: #ffffff;
    }

    .arm-hero p {
        color: #94a3b8;
        font-size: 16px;
        max-width: 650px;
        margin: 0 auto;
        line-height: 1.6;
    }

    /* Grid layout for cards */
    .arm-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 24px;
        margin-bottom: 40px;
    }

    .card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: 30px 24px;
        backdrop-filter: blur(16px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .card:hover {
        border-color: rgba(56, 189, 248, 0.4);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(37, 99, 235, 0.2);
    }

    .card h2, .card h3 {
        font-size: 18px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 16px;
    }

    .instruction-list {
        padding-left: 20px;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .instruction-list li {
        font-size: 14px;
        color: #cbd5e1;
        line-height: 1.5;
    }

    /* Upload & Capture Workspace */
    .upload-workspace {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: 30px;
        backdrop-filter: blur(16px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        text-align: center;
        margin-bottom: 40px;
    }

    .upload-options {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    .custom-btn {
        background: #2563eb;
        color: #ffffff;
        border: none;
        padding: 12px 24px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.25s ease;
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        text-decoration: none;
    }

    .custom-btn:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
    }

    .secondary-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.15) !important;
        color: #cbd5e1;
        box-shadow: none;
    }

    .secondary-btn:hover {
        background: rgba(255, 255, 255, 0.12);
        color: #ffffff;
    }

    #cameraContainer {
        margin: 20px auto;
        max-width: 500px;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid rgba(56, 189, 248, 0.3);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        background: #020617;
    }

    #cameraPreview {
        display: block;
        width: 100%;
        height: auto;
    }

    #captureBtn {
        width: 100%;
        background: #10b981;
        border-radius: 0 0 16px 16px;
        padding: 14px;
        font-weight: 700;
        color: #fff;
        border: none;
        cursor: pointer;
        font-size: 15px;
    }

    #captureBtn:hover {
        background: #059669;
    }

    .preview-image {
        max-width: 320px;
        width: 100%;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        margin: 20px auto;
        display: block;
    }

    /* Analyze Main Action */
    .analyze-center {
        text-align: center;
        margin-bottom: 40px;
    }

    #analyzeBtn {
        background: linear-gradient(135deg, #2563eb, #38bdf8);
        color: #ffffff;
        border: none;
        padding: 16px 36px;
        border-radius: 16px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5);
        transition: all 0.25s ease;
    }

    #analyzeBtn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(56, 189, 248, 0.6);
    }

    /* Results Dashboard HUD Grid */
    .result-dashboard-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
    }

    .result-metric-card {
        background: rgba(30, 41, 59, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 16px;
        padding: 20px;
        text-align: center;
    }

    .result-metric-card h3 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #94a3b8;
        margin-bottom: 8px;
    }

    .result-metric-card p {
        font-size: 18px;
        font-weight: 700;
        color: #ffffff;
        margin: 0;
    }

    .status-banner {
        background: rgba(37, 99, 235, 0.1);
        border: 1px solid rgba(56, 189, 248, 0.2);
        border-radius: 14px;
        padding: 16px 24px;
        text-align: center;
        margin-bottom: 24px;
    }

    .status-banner p {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: var(--accent-blue);
    }
    </style>
</head>

<body>

<header>
<nav>
<div class="logo">
    <img src="assets/logo.png" alt="Logo" style="height: 28px; width: auto;">
    <span id="logoText">NeuroGuard</span>
</div>

<div class="nav-actions">
    <select id="languageSelect" class="language-select">
        <option value="en">🇬🇧 English</option>
        <option value="hi">🇮🇳 हिन्दी</option>
        <option value="pa">🇮🇳 ਪੰਜਾਬੀ</option>
    </select>

    <button id="themeToggle">🌙</button>

    <a href="fast-test.html" style="text-decoration:none;">
        <button class="secondary" id="backBtn">
            Back
        </button>
    </a>
</div>
</nav>
</header>

<div class="arm-page-container">

<!-- Hero Section -->
<div class="arm-hero" id="instructions">
    <div class="badge" id="badgeText">💪 FAST Arm Assessment</div>
    <h1 id="armTitle1">Arm Weakness Detection</h1>
    <p id="armDescription1">
        Raise both arms to shoulder height while facing the camera. Upload a clear front-facing image showing your entire upper body. NeuroGuard will estimate whether both arms appear level.
    </p>
</div>

<!-- Instructions Grid -->
<div class="arm-grid">
    <div class="card">
        <h3 id="instructionsTitle">📋 Instructions</h3>
        <ol class="instruction-list">
            <li id="instruction1">Face the camera.</li>
            <li id="instruction2">Stand straight.</li>
            <li id="instruction3">Raise both arms horizontally.</li>
            <li id="instruction4">Keep elbows straight.</li>
            <li id="instruction5">Ensure both hands are visible.</li>
            <li id="instruction6">Upload the image below.</li>
        </ol>
    </div>

    <div class="card" style="justify-content: center; text-align: center;">
        <h3 style="color: var(--accent-blue); margin-bottom: 12px;">Quick Tip</h3>
        <p style="font-size: 14px; color: #94a3b8; line-height: 1.5; margin: 0;">
            Ensure adequate room lighting and position your camera at chest height so your full upper torso and arms are clearly captured within the frame.
        </p>
    </div>
</div>

<!-- Upload Workspace -->
<div class="upload-workspace">
    <div class="upload-options">
        <button class="custom-btn" id="cameraBtn">
            📷 <span id="cameraBtnText">Take Photo</span>
        </button>

        <label for="imageUpload" class="custom-btn secondary-btn" id="uploadLabel">
            📤 <span id="uploadBtnText">Upload Photo</span>
        </label>
        <input type="file" id="imageUpload" accept="image/*" style="display:none;">
    </div>

    <div id="cameraContainer" style="display:none;">
        <video id="cameraPreview" autoplay playsinline muted></video>
        <button id="captureBtn">📸 Capture Frame</button>
    </div>

    <img id="previewImage" class="preview-image" alt="Preview" style="display:none;">
    <canvas id="canvas" style="display:none;"></canvas>
</div>

<!-- Analyze Action Center -->
<div class="analyze-center">
    <button id="analyzeBtn" class="primary">
        🤖 <span id="analyzeBtnText">Analyze Arms</span>
    </button>
</div>

<!-- Status Banner -->
<div class="status-banner">
    <p id="status">Waiting for image...</p>
</div>

<!-- Results Dashboard HUD -->
<div class="result-dashboard-grid">
    <div class="result-metric-card">
        <h3 id="armScoreTitle">Arm Score</h3>
        <p id="score">-</p>
    </div>

    <div class="result-metric-card">
        <h3 id="riskTitle">Risk Level</h3>
        <p id="risk">-</p>
    </div>

    <div class="result-metric-card">
        <h3 id="leftWristTitle">Left Wrist Height</h3>
        <p id="leftWrist">-</p>
    </div>

    <div class="result-metric-card">
        <h3 id="rightWristTitle">Right Wrist Height</h3>
        <p id="rightWrist">-</p>
    </div>

    <div class="result-metric-card">
        <h3 id="differenceTitle">Difference</h3>
        <p id="difference">-</p>
    </div>
</div>

<!-- Educational Notice Card -->
<div class="card" style="margin-top: 40px;">
    <h2 id="educationTitle" style="font-size: 16px; color: var(--accent-blue); margin-bottom: 10px;">What does this test check?</h2>
    <p id="educationDescription" style="font-size: 13px; color: #94a3b8; line-height: 1.5; margin: 0;">
        During the FAST stroke assessment, difficulty raising one arm or one arm drifting downward may indicate possible muscle weakness.
        <strong style="color: #cbd5e1;">This AI assessment is designed only for educational screening and is NOT a medical diagnosis.</strong>
        If you suspect a stroke, seek emergency medical care immediately.
    </p>
</div>

</div>

<footer>
<div style="text-align: center; color: #64748b; font-size: 13px; padding: 20px 0;">
    <p>© 2026 NeuroGuard • Educational Prototype</p>
</div>
</footer>

<!-- Scripts -->
<script src="js/app.js"></script>
<script src="js/theme.js"></script>
<script src="js/navigation.js"></script>
<script src="js/components.js"></script>
<script src="js/animations.js"></script>
<script src="js/language.js"></script>
<script type="module" src="js/arm.js"></script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
            .then(() => console.log("Service Worker registered"))
            .catch(err => console.error(err));
    });
}
</script>
</body>
</html>
